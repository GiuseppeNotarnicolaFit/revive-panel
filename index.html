<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cruscotto Re·Vive</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4EC;--sup:#FFFDF7;--sup2:#F0E7D2;--testo:#2E3F48;--suave:#4E6470;--forte:#15323F;
  --linea:rgba(46,63,72,.16);--oro:#C8A227;--oro-soft:rgba(200,162,39,.16);
  --ok:#2E7D32;--ok-bg:#DFF1D8;--att:#8F6400;--att-bg:#F7E9BF;--urg:#B3261E;--urg-bg:#F6D4D0;--grigio:#8a9aa3;--grigio-bg:#e6e9eb;
  --serif:"Cormorant Garamond","Iowan Old Style",Palatino,Georgia,serif;--sans:"Nunito Sans","Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;
  --ombra:0 18px 40px -30px rgba(21,50,63,.55);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F252E;--sup:#15323F;--sup2:#1B3D4B;--testo:#F1EADA;--suave:#A9BCC4;--forte:#F7F4EC;--linea:rgba(241,234,218,.2);--oro:#E0BE55;--oro-soft:rgba(224,190,85,.18);
  --ok:#B7E6AE;--ok-bg:#1E4620;--att:#F3D27A;--att-bg:#4A3A08;--urg:#F6D4D0;--urg-bg:#4A1D1A;--grigio:#93a4ad;--grigio-bg:#233d49;--ombra:0 18px 40px -24px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{
  --bg:#0F252E;--sup:#15323F;--sup2:#1B3D4B;--testo:#F1EADA;--suave:#A9BCC4;--forte:#F7F4EC;--linea:rgba(241,234,218,.2);--oro:#E0BE55;--oro-soft:rgba(224,190,85,.18);
  --ok:#B7E6AE;--ok-bg:#1E4620;--att:#F3D27A;--att-bg:#4A3A08;--urg:#F6D4D0;--urg-bg:#4A1D1A;--grigio:#93a4ad;--grigio-bg:#233d49;--ombra:0 18px 40px -24px rgba(0,0,0,.7)}
*{box-sizing:border-box}html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--testo);font-family:var(--sans);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 210px}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--forte);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:40px}h2{font-size:26px;margin-bottom:8px}h3{font-size:20px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--oro);font-weight:700}
.suave{color:var(--suave)}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--linea);padding-bottom:14px;margin-bottom:16px}
.contatori{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cont{display:flex;align-items:baseline;gap:6px;padding:8px 12px;border-radius:12px;background:var(--sup);border:1px solid var(--linea)}
.cont b{font-family:var(--serif);font-size:28px;line-height:1}
.cont.urg b{color:var(--urg)}.cont.att b{color:var(--att)}.cont.ok b{color:var(--ok)}
.toggle{display:inline-flex;gap:4px;padding:4px;border-radius:99px;background:var(--sup);border:1px solid var(--linea)}
.toggle button{min-height:34px;padding:4px 14px;border-radius:99px;border:0;background:transparent;color:var(--testo);font:inherit;font-weight:700;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--forte);color:var(--bg)}
.pannello{background:var(--sup);border:1px solid var(--linea);border-radius:18px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--ombra)}
.pannello.urgente{border-left:7px solid var(--urg)}
.pannello.decisioni{border-left:7px solid var(--oro)}
.oggi-lista{display:grid;gap:8px;margin-top:8px}
.oggi{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:start;padding:10px 12px;border-radius:12px;border:1px solid var(--linea);background:var(--bg)}
.oggi.done{opacity:.5;text-decoration:line-through}
.oggi input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok);cursor:pointer}
.oggi .chi{font-weight:700;color:var(--forte)}
.anota{display:grid;gap:8px;margin-top:10px}
.anota select,.anota input,.anota textarea{width:100%;min-height:44px;font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--linea);background:var(--bg);color:var(--testo);box-sizing:border-box}
.anota textarea{min-height:74px;resize:vertical}
.anota pre{white-space:pre-wrap;font:inherit;font-size:13.5px;background:var(--bg);border:1px dashed var(--linea);border-radius:10px;padding:10px 12px;margin:0}
.pannello.anotar{border-left:7px solid var(--ok)}
.oggi .quando{font-size:12px;color:var(--suave);white-space:nowrap;text-align:right}
.oggi .file{font-family:Menlo,Consolas,monospace;font-size:12.5px;background:var(--sup2);padding:1px 5px;border-radius:5px;word-break:break-all}
.oggi .eta{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--grigio-bg);color:var(--testo);white-space:nowrap;margin-left:6px}
.oggi .eta.urg{background:var(--urg-bg);color:var(--urg)}.oggi .eta.att{background:var(--att-bg);color:var(--att)}
.pannello.arretrati{border-left:7px solid var(--oro)}
.fascia{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:16px 0 2px;padding-bottom:4px;border-bottom:2px solid var(--linea);font-family:var(--serif);font-size:23px;font-weight:600;color:var(--forte)}
.fascia:first-child{margin-top:4px}.fascia small{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--suave)}
.fascia.urg{border-bottom-color:var(--urg)}.fascia.urg span{color:var(--urg)}.fascia.att{border-bottom-color:var(--att)}.fascia.att span{color:var(--att)}.fascia.ok{border-bottom-color:var(--ok)}
.dillo{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(760px,calc(100% - 24px));background:var(--forte);color:var(--bg);border-radius:16px;padding:12px 14px;display:grid;gap:8px;z-index:8;box-shadow:0 18px 40px -18px rgba(0,0,0,.55)}
.dillo .riga{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dillo .riga > div:first-child{flex:1 1 260px}
.dillo b{font-family:var(--serif);font-size:21px;margin-right:6px}
.dillo .nota{font-size:13px;opacity:.85}
.dillo .bottoni{display:flex;gap:8px}
.dillo .bt{background:var(--oro);color:#15323F;border-color:var(--oro)}
.dillo .bt.muto{background:transparent;color:inherit;border-color:currentColor;font-weight:600}
.dillo textarea{width:100%;min-height:52px;max-height:28vh;resize:vertical;font:12.5px/1.45 Menlo,Consolas,monospace;background:var(--sup2);color:var(--testo);border:0;border-radius:10px;padding:8px 10px}
.dillo .esito{font-size:13px;min-height:1em}
[hidden]{display:none !important}
.vecchia{position:sticky;top:8px;z-index:7;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--urg-bg);color:var(--urg);border:2px solid var(--urg);border-radius:14px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--ombra)}
.vecchia > div{flex:1 1 260px}
.vecchia b{font-family:var(--serif);font-size:22px;margin-right:8px}
.vecchia .bt{background:var(--urg);color:var(--urg-bg);border-color:var(--urg)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--grigio-bg);color:var(--testo);white-space:nowrap}
.pill.urg{background:var(--urg-bg);color:var(--urg)}.pill.att{background:var(--att-bg);color:var(--att)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.oro{background:var(--oro-soft);color:var(--forte)}
.pill.esther{background:#E3D8F2;color:#4B2C82}.pill.sara{background:#D6E9F5;color:#1D4E75}.pill.giuseppe{background:var(--oro-soft);color:var(--forte)}
:root[data-theme="dark"] .pill.esther,:root:not([data-theme="light"]) .pill.esther{background:#3A2A5C;color:#DCCBF5}
:root[data-theme="dark"] .pill.sara,:root:not([data-theme="light"]) .pill.sara{background:#1F3A52;color:#CFE4F5}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .pill.esther{background:#E3D8F2;color:#4B2C82}:root:not([data-theme="dark"]) .pill.sara{background:#D6E9F5;color:#1D4E75}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.chip{min-height:38px;padding:6px 14px;border-radius:99px;border:1px solid var(--linea);background:var(--sup);color:var(--testo);font:inherit;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--forte);color:var(--bg);border-color:var(--forte)}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px;border-radius:8px}
.gruppo{margin-top:22px}
.gruppo .titolo{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.gruppo .titolo .n{font-family:var(--serif);font-size:30px;color:var(--oro);line-height:1}
.gruppo .spiega{font-size:13.5px;color:var(--suave);margin:-4px 0 10px}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.carta{position:relative;text-align:left;background:var(--sup);border:1px solid var(--linea);border-left:7px solid var(--grigio);border-radius:16px;padding:14px 16px 14px 18px;cursor:pointer;color:var(--testo);font:inherit;display:flex;flex-direction:column;gap:8px;box-shadow:var(--ombra)}
.carta:hover{border-color:var(--oro);border-left-color:inherit}
.carta.rosso{border-left-color:var(--urg)}.carta.giallo{border-left-color:var(--att)}.carta.verde{border-left-color:var(--ok)}
.carta .testa{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.carta h3{font-size:22px}
.carta .sotto{font-size:12.5px;color:var(--suave)}
.carta .fase{font-size:13.5px;color:var(--suave);min-height:38px}
.prog{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;font-size:12.5px}
.prog .ob{color:var(--forte);font-weight:600}
.prog .num{color:var(--suave);white-space:nowrap}
.pista{grid-column:1/-1;height:10px;border-radius:99px;background:var(--sup2);overflow:hidden}
.pista i{display:block;height:100%;background:linear-gradient(90deg,var(--oro),var(--ok));border-radius:99px}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:2px}
.stat div{background:var(--bg);border-radius:10px;padding:7px 8px;border:1px solid var(--linea)}
.stat .n{font-family:var(--serif);font-size:24px;line-height:1;color:var(--forte)}
.stat .n.urg{color:var(--urg)}.stat .n.att{color:var(--att)}.stat .n.ok{color:var(--ok)}
.stat .l{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);margin-top:3px}
.righe{font-size:13.5px;margin:0;padding:0;list-style:none}
.righe li{padding:4px 0;border-top:1px dashed var(--linea)}
.righe .tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--oro);font-weight:700;margin-right:6px}
.blocco-riga{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:8px 0;border-top:1px dashed var(--linea);font-size:13.5px}
.blocco-riga b{color:var(--forte)}
.velo{position:fixed;inset:0;background:rgba(15,37,46,.45);display:none;z-index:9}.velo.on{display:block}
#cancello{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}#cancello[hidden]{display:none}
.cajon{position:fixed;top:0;right:0;height:100%;width:min(640px,100%);background:var(--bg);border-left:1px solid var(--linea);transform:translateX(101%);transition:transform .22s ease;overflow-y:auto;z-index:10;padding:18px 22px 60px}
.cajon.on{transform:none}
.cajon .testa{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.blocco{margin-top:16px}.blocco h4{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--oro);border-bottom:1px solid var(--linea);padding-bottom:4px}
.blocco ul{margin:0;padding-left:18px}.blocco li{margin:4px 0}
.tappe{list-style:none;padding:0;margin:0}
.tappe li{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:baseline;padding:5px 0;border-top:1px dashed var(--linea)}
.tappe .b{font-weight:700;font-size:15px}.tappe .ok .b{color:var(--ok)}.tappe .no .b{color:var(--grigio)}
.tappe .no{color:var(--suave)}.tappe .d{font-size:12px;color:var(--suave)}
.numeri{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.numeri div{background:var(--sup);border:1px solid var(--linea);border-radius:10px;padding:8px 10px}
.numeri .v{font-family:var(--serif);font-size:22px;color:var(--forte);line-height:1.1}.numeri .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}.numeri .d{font-size:12px;color:var(--suave)}
.apri{display:inline-block;margin:2px 4px 2px 0;padding:5px 12px;border-radius:8px;background:var(--oro);color:#15323F;font-weight:700;text-decoration:none;font-size:.85em;white-space:nowrap}
.bt{min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--linea);background:var(--sup);color:var(--testo);font:inherit;font-weight:700;cursor:pointer}
code{font-family:Menlo,Consolas,monospace;font-size:12.5px;background:var(--sup2);padding:1px 5px;border-radius:5px}
.ciclo{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:8px}
.ciclo div{background:var(--bg);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;font-size:13.5px}
.ciclo b{display:block;color:var(--forte);font-family:var(--serif);font-size:19px;margin-bottom:4px}
.legenda{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:8px;font-size:13.5px}
.legenda div{background:var(--bg);border:1px solid var(--linea);border-radius:12px;padding:10px 12px}
details summary{cursor:pointer;font-weight:700;color:var(--forte)}
.pie{margin-top:22px;font-size:12.5px;color:var(--suave)}
.avviso{font-size:12.5px;color:var(--att);margin-top:6px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:640px){h1{font-size:30px}.oggi{grid-template-columns:28px 1fr}.oggi .quando{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
<div class="vecchia" id="vecchia" role="alert" hidden>
  <div><b data-i="vecchia_titolo"></b><span id="vecchia-testo"></span></div>
  <button class="bt" id="ricarica" data-i="ricarica"></button>
</div>
<div class="vecchia" id="eta" role="status" style="position:static" hidden><div><b id="eta-q"></b><span id="eta-t"></span></div></div>
<header>
  <div>
    <div class="eyebrow" data-i="eyebrow"></div>
    <h1 data-i="titolo"></h1>
    <div class="suave" id="agg"></div>
  </div>
  <div class="contatori">
    <div class="toggle" id="lingua" role="group" aria-label="Lingua"><button data-l="it" aria-pressed="true">IT</button><button data-l="es" aria-pressed="false">ES</button></div>
    <div class="toggle" id="persona" role="group" aria-label="Persona"></div>
    <div id="contatori" style="display:contents"></div>
  </div>
</header>

<section class="pannello urgente">
  <div class="eyebrow" data-i="oggi_eyebrow"></div>
  <h2 data-i="oggi_titolo"></h2>
  <div class="suave" data-i="oggi_sotto"></div>
  <div class="oggi-lista" id="oggi"></div>
  <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="bt" id="copia" data-i="copia"></button><span class="suave" id="copiato" style="align-self:center"></span></div>
</section>

<section class="pannello arretrati" hidden>
  <div class="eyebrow" data-i="arr_eyebrow"></div>
  <h2 data-i="arr_titolo"></h2>
  <div class="suave" data-i="arr_sotto"></div>
  <div class="oggi-lista" id="arretrati"></div>
</section>

<section class="pannello anotar">
  <div class="eyebrow" data-i="anota_eyebrow"></div>
  <h2 data-i="anota_titolo"></h2>
  <div class="suave" data-i="anota_sotto"></div>
  <div class="anota">
    <select id="an-persona" aria-label="Persona"></select>
    <input id="an-otra" type="text" hidden>
    <select id="an-hecho" aria-label="Hecho"></select>
    <textarea id="an-detalle"></textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="bt" id="an-envia" data-i="anota_envia" style="background:var(--oro);color:#15323F;border-color:var(--oro)"></button><button class="bt" id="an-copia" data-i="anota_copia"></button><span class="suave" id="an-copiato"></span></div>
    <pre id="an-anteprima" hidden></pre>
  </div>
</section>

<section class="pannello decisioni">
  <div class="eyebrow" data-i="blocchi_eyebrow"></div>
  <h2 data-i="blocchi_titolo"></h2>
  <div class="suave" data-i="blocchi_sotto"></div>
  <div id="blocchi" style="margin-top:8px"></div>
</section>

<section class="pannello">
  <details>
    <summary data-i="legenda_titolo"></summary>
    <div class="legenda" id="legenda"></div>
  </details>
</section>

<div class="chips" id="chips" role="group" aria-label="Filtri"></div>
<div id="gruppi"></div>

<section class="pannello" style="margin-top:22px">
  <div class="eyebrow" data-i="ciclo_eyebrow"></div>
  <h2 data-i="ciclo_titolo"></h2>
  <div class="ciclo" id="ciclo"></div>
  <div class="pie" id="pie"></div>
</section>

<section class="pannello" style="margin-top:18px">
  <div class="eyebrow" id="manca-eyebrow"></div>
  <h2 id="manca-titolo"></h2>
  <div class="suave" id="manca-sotto"></div>
  <div id="manca" style="margin-top:8px"></div>
</section>
</div>

<div class="dillo" id="dillo" role="region" aria-label="Dillo a Claude" hidden>
  <div class="riga">
    <div><b id="dillo-n"></b><span class="nota" data-i="dillo_nota"></span></div>
    <div class="bottoni"><button class="bt muto" id="dillo-nascondi" data-i="dillo_nascondi"></button><button class="bt" id="dillo-copia" data-i="dillo_copia"></button></div>
  </div>
  <textarea id="dillo-testo" readonly rows="2" aria-label="Messaggio"></textarea>
  <div class="esito" id="dillo-esito" aria-live="polite"></div>
</div>

<div class="velo" id="velo"></div>
<div id="cancello" hidden>
  <form id="cancello-form" style="width:min(420px,100%);background:var(--sup);border:1px solid var(--linea);border-radius:18px;padding:22px;box-shadow:var(--ombra)">
    <div class="eyebrow">Re·Vive Gran Canaria</div>
    <h2 style="margin:6px 0 4px" data-c="tit"></h2>
    <p class="suave" style="margin:0 0 12px" data-c="sotto"></p>
    <input id="cancello-parola" type="password" autocomplete="current-password" style="width:100%;min-height:44px;font:inherit;padding:8px 12px;border-radius:10px;border:1px solid var(--linea);background:var(--bg);color:var(--testo)">
    <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap"><button class="bt" type="submit" data-c="entra"></button><span id="cancello-msg" style="color:var(--urg);font-size:13px"></span></div>
  </form>
</div>
<aside class="cajon" id="cajon" role="dialog" aria-modal="true" aria-labelledby="cajon-tit" tabindex="-1"></aside>

<script>

 oggi_sotto:{it:"Tutto quello che è aperto, in ordine di scadenza: prima quello già scaduto, poi quello da fare oggi, domani, in settimana. Se per farla c'è da mandare qualcosa, il file sta sotto la riga con «Apri»; un'etichetta rossa «file da preparare» vuol dire che Claude non l'ha ancora messo in cassetta. Scegli il tuo nome in alto per vedere solo le tue. Quando è fatta spuntala e basta: la spunta arriva da sola al Mac di Giuseppe, che in 15 minuti aggiorna tutto per tutti e tre.",es:"Todo lo que está abierto, por orden de vencimiento: primero lo ya vencido, luego lo de hoy, mañana y esta semana. Si hay que enviar algo, el archivo está debajo de la línea con «Abrir»; una etiqueta roja «archivo por preparar» quiere decir que Claude todavía no lo ha puesto en la bandeja. Elige tu nombre arriba para ver solo las tuyas. Cuando esté hecha, márcala y ya está: la marca llega sola al Mac de Giuseppe, que en 15 minutos lo actualiza todo para los tres."},

 leg:[
  {it:"<b>Rosso = aspetta noi.</b> C'è qualcosa a carico di Giuseppe, Esther o Sara e la persona sta aspettando. Prima si chiude, meglio è.",es:"<b>Rojo = nos espera.</b> Hay algo a cargo de Giuseppe, Esther o Sara y la persona está esperando. Cuanto antes se cierre, mejor."},
  {it:"<b>Giallo = aspettiamo lei o lui.</b> Abbiamo fatto la nostra parte: risposta, data o decisione sono dall'altra parte. Si ricontatta alla data scritta.",es:"<b>Amarillo = esperamos a ella o a él.</b> Hemos hecho nuestra parte: la respuesta, la fecha o la decisión están del otro lado. Se recontacta en la fecha escrita."},
  {it:"<b>Verde = in ordine.</b> Niente in sospeso da nessuna parte.",es:"<b>Verde = en orden.</b> Nada pendiente por ningún lado."},
  {it:"<b>La barra</b> sotto il nome dice quante tappe del percorso sono fatte rispetto al traguardo scritto accanto. Il numero grande è da quanti giorni la persona non riceve una nostra risposta.",es:"<b>La barra</b> bajo el nombre dice cuántas etapas del camino están hechas respecto a la meta escrita al lado. El número grande es cuántos días lleva la persona sin recibir una respuesta nuestra."},
  {it:"<b>Tre gruppi.</b> Seguiti: hanno già un programma con noi. Dopo il massaggio: hanno ricevuto almeno un massaggio e aspettano il seguito promesso. A parole: ci siamo parlati, nessun massaggio ancora.",es:"<b>Tres grupos.</b> Seguidos: ya tienen un programa con nosotros. Después del masaje: han recibido al menos un masaje y esperan la continuación prometida. De palabra: hemos hablado, ningún masaje todavía."},
  {it:"<b>Clicca una card</b> per aprire la scheda completa: massaggi fatti, promessa aperta, tappe, cosa manca da noi e da lei, file pronti da mandare.",es:"<b>Pulsa una tarjeta</b> para abrir la ficha completa: masajes hechos, promesa abierta, etapas, qué falta de nosotros y de ella, archivos listos para enviar."}

 ciclo:[
  {it:"<b>1. Chi fa qualcosa lo dice con tre righe</b>Dopo ogni massaggio, messaggio, risposta o appuntamento, chi l'ha fatto scrive nel gruppo REVIVE CLIENTES tre righe: Persona, Hecho, Detalle. Il bottone \"Segna cosa hai fatto\" qui sopra le prepara già pronte.",es:"<b>1. Quien hace algo lo dice con tres líneas</b>Después de cada masaje, mensaje, respuesta o cita, quien lo hizo escribe en el grupo REVIVE CLIENTES tres líneas: Persona, Hecho, Detalle. El botón \"Anotar lo que he hecho\" de arriba las prepara ya listas."},
  {it:"<b>2. Il registro legge, Claude decide</b>Il registro legge le tre righe da solo e aggiorna i fatti della scheda (massaggio, date, tappa, semaforo). Claude, al giro dopo, scrive i prossimi passi: chi fa cosa e quando.",es:"<b>2. El registro lee, Claude decide</b>El registro lee las tres líneas solo y actualiza los hechos de la ficha (masaje, fechas, etapa, semáforo). Claude, en la siguiente vuelta, escribe los próximos pasos: quién hace qué y cuándo."},
  {it:"<b>3. La cassetta</b>Nella cartella della persona, <code>_DA-INVIARE/</code>: i testi pronti da copiare su WhatsApp e gli allegati. Il bottone «Apri» accanto a ogni file lo apre direttamente su Google Drive, dal computer e dal telefono: Giuseppe nella sua cartella privata «Bandeja-ReVive-Giuseppe», Sara ed Esther nella loro «Bandeja-ReVive-Equipo».",es:"<b>3. La bandeja</b>En la carpeta de la persona, <code>_DA-INVIARE/</code>: los textos listos para copiar en WhatsApp y los adjuntos. En el móvil: vuestros archivos están en Google Drive, carpeta «Bandeja-ReVive-Equipo» (compartida con revivegrancanaria), y el botón «Abrir» al lado de cada archivo lo abre directamente."},
  {it:"<b>4. Chi manda dice \"enviado\"</b>Le stesse tre righe con Hecho: enviado. La tappa si accende, il semaforo passa a giallo (aspettiamo lei), la cassetta si svuota al giro di Claude.",es:"<b>4. Quien envía dice \"enviado\"</b>Las mismas tres líneas con Hecho: enviado. La etapa se enciende, el semáforo pasa a amarillo (la esperamos), la bandeja se vacía en la vuelta de Claude."},
  {it:"<b>5. Il cruscotto si rigenera da solo</b>Ogni 15 minuti e ogni mattina alle 7, sullo stesso link. Le tre righe entrano quando Giuseppe passa la chat del gruppo a Claude (di norma una volta a settimana, o prima se serve).",es:"<b>5. El panel se regenera solo</b>Cada 15 minutos y cada mañana a las 7, en el mismo enlace. Las tres líneas entran cuando Giuseppe pasa el chat del grupo a Claude (normalmente una vez por semana, o antes si hace falta)."}

// true = spuntata ma non inviata; "enviando"; "enviado@<ms>" = arrivata al modulo; "copiato" = messaggio copiato; "error" = senza rete.
function stSp(id){var v=store[id];if(v===true)return "pend";if(v==="copiato")return "copiato";if(v==="error")return "error";if(v==="enviando")return "enviando";if(typeof v==="string"&&v.indexOf("enviado@")===0)return "enviado";return ""}

function posta(campi){if(!SPUNTE||!SPUNTE.url||!window.fetch||!window.FormData)return Promise.reject(new Error("senza canale"));
  var fd=new FormData(),E=SPUNTE.entradas||{};Object.keys(campi).forEach(function(k){if(E[k])fd.append(E[k],campi[k])});
  return fetch(SPUNTE.url,{method:"POST",mode:"no-cors",body:fd,keepalive:true})}
function enviar(o,accion){

  if(accion==="hecho"){store[o.id]="enviando";salva()}
  return posta(campi).then(function(){if(accion==="hecho"){store[o.id]="enviado@"+Date.now()}else{delete store[o.id]}salva();return true},
    function(){if(accion==="hecho"){store[o.id]="error"}else{delete store[o.id]}salva();return false})}

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function apriCifrato(parola){
  var raw=b64(CIFRATO),salt=raw.slice(0,16),ct=raw.slice(16),enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(parola),"PBKDF2",false,["deriveBits"]).then(function(km){
    return crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},km,384)}).then(function(bits){
    var b=new Uint8Array(bits);return crypto.subtle.importKey("raw",b.slice(0,32),{name:"AES-CBC"},false,["decrypt"]).then(function(key){
      return crypto.subtle.decrypt({name:"AES-CBC",iv:b.slice(32,48)},key,ct)})}).then(function(pt){
    return JSON.parse(new TextDecoder().decode(pt))});
}

  if(DATA){render();dopoRender();return}

}
