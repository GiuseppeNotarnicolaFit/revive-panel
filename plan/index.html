<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan de Equipo Re·Vive</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F4EC;--sup:#FFFDF7;--sup2:#F0E7D2;--testo:#2E3F48;--suave:#4E6470;--forte:#15323F;
  --linea:rgba(46,63,72,.16);--oro:#C8A227;--oro-soft:rgba(200,162,39,.16);
  --ok:#2E7D32;--ok-bg:#DFF1D8;--att:#8F6400;--att-bg:#F7E9BF;--urg:#B3261E;--urg-bg:#F6D4D0;--grigio-bg:#e6e9eb;
  --sara-bg:#D6E9F5;--sara:#1D4E75;--esther-bg:#E3D8F2;--esther:#4B2C82;
  --serif:"Cormorant Garamond","Iowan Old Style",Palatino,Georgia,serif;--sans:"Nunito Sans","Avenir Next",Avenir,"Helvetica Neue",Arial,sans-serif;
  --ombra:0 18px 40px -30px rgba(21,50,63,.55);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F252E;--sup:#15323F;--sup2:#1B3D4B;--testo:#F1EADA;--suave:#A9BCC4;--forte:#F7F4EC;--linea:rgba(241,234,218,.2);--oro:#E0BE55;--oro-soft:rgba(224,190,85,.18);
  --ok:#B7E6AE;--ok-bg:#1E4620;--att:#F3D27A;--att-bg:#4A3A08;--urg:#F6D4D0;--urg-bg:#4A1D1A;--grigio-bg:#233d49;
  --sara-bg:#1F3A52;--sara:#CFE4F5;--esther-bg:#3A2A5C;--esther:#DCCBF5;--ombra:0 18px 40px -24px rgba(0,0,0,.7)}}
:root[data-theme="dark"]{
  --bg:#0F252E;--sup:#15323F;--sup2:#1B3D4B;--testo:#F1EADA;--suave:#A9BCC4;--forte:#F7F4EC;--linea:rgba(241,234,218,.2);--oro:#E0BE55;--oro-soft:rgba(224,190,85,.18);
  --ok:#B7E6AE;--ok-bg:#1E4620;--att:#F3D27A;--att-bg:#4A3A08;--urg:#F6D4D0;--urg-bg:#4A1D1A;--grigio-bg:#233d49;
  --sara-bg:#1F3A52;--sara:#CFE4F5;--esther-bg:#3A2A5C;--esther:#DCCBF5;--ombra:0 18px 40px -24px rgba(0,0,0,.7)}
*{box-sizing:border-box}html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--testo);font-family:var(--sans);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding:18px 18px 210px}
h1,h2,h3{font-family:var(--serif);font-weight:600;color:var(--forte);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:40px}h2{font-size:26px;margin-bottom:6px}h3{font-size:21px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--oro);font-weight:700}
.suave{color:var(--suave)}
.spiega{color:var(--suave);font-size:14px;max-width:78ch}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--linea);padding-bottom:14px;margin-bottom:16px}
.enlace{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;color:var(--forte);text-decoration:underline;text-decoration-color:var(--oro);text-underline-offset:3px}
.contatori{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cont{display:flex;align-items:baseline;gap:6px;padding:8px 12px;border-radius:12px;background:var(--sup);border:1px solid var(--linea)}
.cont b{font-family:var(--serif);font-size:28px;line-height:1}
.cont.urg b{color:var(--urg)}.cont.att b{color:var(--att)}.cont.ok b{color:var(--ok)}
.toggle{display:inline-flex;gap:4px;padding:4px;border-radius:99px;background:var(--sup);border:1px solid var(--linea)}
.toggle button{min-height:34px;padding:4px 14px;border-radius:99px;border:0;background:transparent;color:var(--testo);font:inherit;font-weight:700;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--forte);color:var(--bg)}
.pannello{background:var(--sup);border:1px solid var(--linea);border-radius:18px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--ombra)}
.pannello.urgente{border-left:7px solid var(--urg)}
.pannello.decisioni{border-left:7px solid var(--oro)}
.semanas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-top:10px}
.sem{display:flex;flex-direction:column;gap:6px;text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--linea);background:var(--bg);color:var(--testo);font:inherit;cursor:pointer}
.sem:hover{border-color:var(--oro)}
.sem .arriba{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.sem .n{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1;color:var(--forte)}
.sem .d{font-size:12px;color:var(--suave);white-space:nowrap}
.sem .est{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--suave)}
.sem .barra{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12px;color:var(--suave)}
.sem.actual{border:2px solid var(--oro);background:var(--oro-soft)}.sem.actual .est{color:var(--forte)}
.sem.urg{border-color:var(--urg)}.sem.urg .est{color:var(--urg)}.sem.ok .est{color:var(--ok)}
.pista{height:8px;border-radius:99px;background:var(--sup2);overflow:hidden;display:block}
.pista i{display:block;height:100%;background:linear-gradient(90deg,var(--oro),var(--ok));border-radius:99px}
.oggi-lista{display:grid;gap:8px;margin-top:8px}
.oggi{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 12px;border-radius:12px;border:1px solid var(--linea);background:var(--bg);cursor:pointer}
.oggi.done{opacity:.5}.oggi.done .tit{text-decoration:line-through}
.oggi.hecha{opacity:.75;cursor:default}.oggi.hecha .tit{text-decoration:line-through}
.oggi input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--ok);cursor:pointer}
.oggi .cuerpo{display:flex;flex-direction:column;gap:5px;min-width:0}
.oggi .tit{font-weight:700;color:var(--forte)}
.oggi .pills{display:flex;flex-wrap:wrap;gap:4px}
.oggi .sub{display:block;font-size:13px;color:var(--suave)}
.oggi .bloq{display:block;font-size:13.5px;background:var(--urg-bg);color:var(--testo);border-radius:8px;padding:6px 9px}
.oggi .quando{font-size:12px;color:var(--suave);white-space:nowrap;text-align:right}
.retraso{color:var(--urg);font-size:12px}
.fascia{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:16px 0 2px;padding-bottom:4px;border-bottom:2px solid var(--linea);font-family:var(--serif);font-size:23px;font-weight:600;color:var(--forte)}
.fascia:first-child{margin-top:4px}.fascia small,details.mas summary small{font-family:var(--sans);font-size:12.5px;font-weight:600;color:var(--suave)}
.fascia.urg{border-bottom-color:var(--urg)}.fascia.urg span{color:var(--urg)}.fascia.att{border-bottom-color:var(--att)}.fascia.att span{color:var(--att)}
details.mas{margin-top:16px}
details.mas summary{cursor:pointer;font-family:var(--serif);font-size:23px;font-weight:600;color:var(--forte);border-bottom:2px solid var(--ok);padding-bottom:4px}
.acciones{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:16px;align-items:start;margin-bottom:16px}
.dos .pannello{margin-bottom:0}
.blocco-riga{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:9px 0;border-top:1px dashed var(--linea);font-size:13.5px}
.blocco-riga b{color:var(--forte)}
.crono{list-style:none;margin:8px 0 0;padding:0}
.crono li{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px dashed var(--linea);font-size:13.5px}
.crono .f{font-weight:700;color:var(--forte);white-space:nowrap}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:99px;background:var(--grigio-bg);color:var(--testo);white-space:nowrap}
.pill.urg{background:var(--urg-bg);color:var(--urg)}.pill.att{background:var(--att-bg);color:var(--att)}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.oro{background:var(--oro-soft);color:var(--forte)}
.pill.giuseppe{background:var(--oro-soft);color:var(--forte)}.pill.sara{background:var(--sara-bg);color:var(--sara)}.pill.esther{background:var(--esther-bg);color:var(--esther)}
.vias{margin:22px 0 16px}
.griglia{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px;margin-top:10px}
.carta{text-align:left;background:var(--sup);border:1px solid var(--linea);border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--testo);font:inherit;display:flex;flex-direction:column;gap:8px;box-shadow:var(--ombra)}
.carta:hover{border-color:var(--oro)}
.carta .sotto{font-size:12.5px;color:var(--suave)}
.carta .barra{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;font-size:12.5px;color:var(--suave)}
.carta .meta{font-size:13.5px;color:var(--suave)}
.carta .prox{font-size:13px;border-top:1px dashed var(--linea);padding-top:8px}
.consulta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:8px;margin-top:8px;align-items:start}
.consulta details{background:var(--bg);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;font-size:13.5px}
.consulta summary{cursor:pointer;font-weight:700;color:var(--forte)}
.consulta ul{margin:8px 0 0;padding-left:18px}.consulta li{margin:6px 0}
.ciclo{display:grid;gap:8px;margin-top:8px}.ciclo b{display:block;color:var(--forte)}
code{font-family:Menlo,Consolas,monospace;font-size:12px;background:var(--sup2);padding:1px 5px;border-radius:5px;word-break:break-all}
.apri{display:inline-block;margin:2px 4px 2px 6px;padding:4px 12px;border-radius:8px;background:var(--oro);color:#15323F;font-weight:700;text-decoration:none;font-size:12.5px;white-space:nowrap}
.bt{min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--linea);background:var(--sup);color:var(--testo);font:inherit;font-weight:700;cursor:pointer}
:focus-visible{outline:3px solid var(--oro);outline-offset:2px;border-radius:8px}
.dillo{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);width:min(760px,calc(100% - 24px));background:var(--forte);color:var(--bg);border-radius:16px;padding:12px 14px;display:grid;gap:8px;z-index:8;box-shadow:0 18px 40px -18px rgba(0,0,0,.55)}
.dillo .riga{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.dillo .riga > div:first-child{flex:1 1 260px}
.dillo b{font-family:var(--serif);font-size:21px;margin-right:6px}
.dillo .nota{font-size:13px;opacity:.85}
.dillo .bottoni{display:flex;gap:8px}
.dillo .bt{background:var(--oro);color:#15323F;border-color:var(--oro)}
.dillo .bt.muto{background:transparent;color:inherit;border-color:currentColor;font-weight:600}
.dillo textarea{width:100%;min-height:52px;max-height:28vh;resize:vertical;font:12.5px/1.45 Menlo,Consolas,monospace;background:var(--sup2);color:var(--testo);border:0;border-radius:10px;padding:8px 10px}
.dillo .esito{font-size:13px;min-height:1em}
.vecchia{position:sticky;top:8px;z-index:7;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--urg-bg);color:var(--urg);border:2px solid var(--urg);border-radius:14px;padding:10px 14px;margin-bottom:14px;box-shadow:var(--ombra)}
.vecchia > div{flex:1 1 260px}.vecchia b{font-family:var(--serif);font-size:22px;margin-right:8px}
.vecchia .bt{background:var(--urg);color:var(--urg-bg);border-color:var(--urg)}
[hidden]{display:none !important}
.velo{position:fixed;inset:0;background:rgba(15,37,46,.45);display:none;z-index:9}.velo.on{display:block}
#cancello{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}#cancello[hidden]{display:none}
.cajon{position:fixed;top:0;right:0;height:100%;width:min(680px,100%);background:var(--bg);border-left:1px solid var(--linea);transform:translateX(101%);transition:transform .22s ease;overflow-y:auto;z-index:10;padding:18px 18px 60px}
.cajon.on{transform:none}
.cajon .testa{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.blocco{margin-top:16px}.blocco h4{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--oro);border-bottom:1px solid var(--linea);padding-bottom:4px}
.pie{margin-top:22px;font-size:12.5px;color:var(--suave)}
/* Bacheca per settimana (22/09/2026, Giuseppe: "mi piace vedere le settimane una dopo l'altra da sinistra a destra"):
   le schede settimana di prima restano identiche e fanno da testa a sei colonne coi loro compiti. */
.tablero-pan{width:min(1600px,calc(100vw - 32px));margin-left:calc(50% - min(800px,50vw - 16px))}
.tablero-pan.urgente{border-left:7px solid var(--urg)}
.tab-testa{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.tablero{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;margin-top:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;overscroll-behavior-x:contain}
.col{display:flex;flex-direction:column;gap:8px;min-width:0;scroll-snap-align:start;border-radius:16px;padding:6px}
.col.actual{background:var(--oro-soft)}
.col .sem{width:100%}
.col-tareas{display:flex;flex-direction:column;gap:8px}
.tk{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:start;padding:10px 10px 9px;border-radius:12px;border:1px solid var(--linea);background:var(--bg);box-shadow:0 12px 24px -22px rgba(21,50,63,.7);cursor:pointer}
.tk:hover{border-color:var(--oro)}
.tk.urg{border-color:var(--urg);box-shadow:inset 3px 0 0 var(--urg)}
.tk.bloq{background:var(--urg-bg)}
.tk.envio{border-color:var(--ok);background:var(--ok-bg)}
.tk.done .tt{text-decoration:line-through}
.tk .caja{display:flex;justify-content:center;padding-top:1px;cursor:pointer}
.tk input{width:20px;height:20px;margin:0;accent-color:var(--ok);cursor:pointer}
.tk .cuerpo{display:flex;flex-direction:column;gap:5px;min-width:0}
.tk .tt{font-weight:700;color:var(--forte);font-size:14px;line-height:1.28;overflow-wrap:anywhere}
.tk .mini{display:flex;flex-wrap:wrap;gap:3px 4px;align-items:center}
.tk .mini .pill{font-size:10px;padding:2px 7px;letter-spacing:.05em}
.tk .via{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--suave);margin-left:2px}
.tk .bl{font-size:12px;font-weight:700;color:var(--urg)}
.tk .pie-tk{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 6px;font-size:12px;color:var(--suave)}
.tk .pie-tk .urg{color:var(--urg);font-weight:700}.tk .pie-tk .ok{color:var(--ok);font-weight:700}.tk .pie-tk .att{color:var(--att);font-weight:700}
.tk .apri{margin:0;padding:2px 10px;font-size:12px;background:transparent;border:1px solid var(--oro);color:var(--forte)}.tk .apri:hover{background:var(--oro);color:#15323F}
.col-hechas{display:flex;flex-direction:column;gap:6px}
.col-hechas .rotulo{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ok);padding:4px 4px 0}
.tk.hecha{opacity:.72;padding:7px 10px;box-shadow:none;background:transparent}
.tk.hecha .tt{font-size:13px;font-weight:600;text-decoration:line-through}
.tk .segno{color:var(--ok);font-weight:800;text-align:center;line-height:1.3}
.col-vacia{font-size:13px;color:var(--suave);padding:6px}
.salti{display:none}
.prova-banda{background:var(--att-bg);color:var(--att);border:2px dashed var(--att);border-radius:12px;padding:8px 12px;margin-bottom:12px;font-weight:700;font-size:13.5px}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
@media (max-width:900px){.semanas{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){h1{font-size:32px}.oggi{grid-template-columns:28px minmax(0,1fr)}.oggi .quando{grid-column:2;text-align:left;white-space:normal}.semanas{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.tablero{grid-auto-columns:86%}.salti{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}.salti button{flex:1 0 44px;min-width:0;min-height:38px;padding:4px 2px;border-radius:10px;border:1px solid var(--linea);background:var(--bg);color:var(--forte);font:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap}.salti button b{font-family:var(--serif);font-size:16px;margin-left:4px}.salti button.urg{border-color:var(--urg);color:var(--urg)}.salti button.actual{border:2px solid var(--oro);background:var(--oro-soft)}.salti button.ok{color:var(--ok)}}
</style>
</head>
<body>
<div class="wrap">
<div class="prova-banda" id="prova-banda" hidden></div>
<div class="vecchia" id="vecchia" role="alert" hidden>
  <div><b data-i="vecchia_titolo"></b><span id="vecchia-testo"></span></div>
  <button class="bt" id="ricarica" data-i="ricarica"></button>
</div>
<div class="vecchia" id="eta" role="status" style="position:static" hidden><div><b id="eta-q"></b><span id="eta-t"></span></div></div>
<header>
  <div>
    <div class="eyebrow" data-i="eyebrow"></div>
    <h1 data-i="titulo"></h1>
    <div class="suave" id="agg"></div>
    <a class="enlace" id="panel" target="_blank" rel="noopener" data-i="panel_link" hidden></a>
    <a class="enlace" id="carpeta-drive" target="_blank" rel="noopener" data-i="carpeta_drive" style="margin-left:14px" hidden></a>
  </div>
  <div class="contatori">
    <div class="toggle" id="lingua" role="group" aria-label="Idioma"><button data-l="es" aria-pressed="true">ES</button><button data-l="it" aria-pressed="false">IT</button></div>
    <div class="toggle" id="persona" role="group" aria-label="Persona"></div>
    <div class="contatori" id="contatori"></div>
  </div>
</header>

<section class="pannello tablero-pan" id="tablero-pan">
  <div class="tab-testa">
    <div>
      <div class="eyebrow" id="tab-eyebrow"></div>
      <h2 id="tab-titulo"></h2>
      <div class="spiega" id="tab-sotto"></div>
    </div>
    <div class="toggle" id="vista" role="group" aria-label="Vista"></div>
  </div>
  <div class="salti" id="salti" role="group" aria-label="Semanas"></div>
  <div class="tablero" id="tablero"></div>
  <div id="lista" hidden></div>
  <div class="acciones"><button class="bt" id="copia-semana" data-i="copia_semana"></button><span class="suave" id="copiado"></span></div>
</section>

<div class="dos">
  <section class="pannello decisioni">
    <div class="eyebrow" data-i="bloq_eyebrow"></div>
    <h2 data-i="bloq_titulo"></h2>
    <div class="spiega" data-i="bloq_sotto"></div>
    <div id="bloqueos" style="margin-top:8px"></div>
  </section>
  <section class="pannello">
    <div class="eyebrow" data-i="cro_eyebrow"></div>
    <h2 data-i="cro_titulo"></h2>
    <div id="crono"></div>
  </section>
</div>

<section class="vias">
  <div class="eyebrow" data-i="vias_eyebrow"></div>
  <h2 data-i="vias_titulo"></h2>
  <div class="spiega" data-i="vias_sotto"></div>
  <div class="griglia" id="vias"></div>
</section>

<section class="pannello">
  <div class="eyebrow" data-i="consulta_eyebrow"></div>
  <div class="consulta" id="consulta"></div>
  <div class="pie" id="pie"></div>
</section>
</div>

<div class="dillo" id="dillo" role="region" aria-label="Mensaje" hidden>
  <div class="riga">

function isoDe(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}

// #hoy=AAAA-MM-GG in fondo all'indirizzo simula un altro giorno; #prova-cruscotto accende subito l'avviso "pagina vecchia".
var HOY=isoDe(new Date()),PROVA=false;

function dias(a,b){return Math.round((new Date(a+"T12:00")-new Date(b+"T12:00"))/86400e3)}

function fmtData(iso){if(!iso)return "";var d=new Date(iso+"T12:00");if(isNaN(d))return iso;var gi=lang==="es"?["dom","lun","mar","mié","jue","vie","sáb"]:["dom","lun","mar","mer","gio","ven","sab"];return gi[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1)}

function actTxt(){var a=DATA.actualizado||"";return a.length>=16?a.slice(8,10)+"/"+a.slice(5,7)+"/"+a.slice(0,4)+" h "+a.slice(11,16):GENERATO}

  if(u)return '<a class="apri" href="'+esc(u)+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">'+T("abrir_drive")+'</a>';

// Stati di una spunta in questo telefono: true = fatta ma non inviata; "enviando"; "enviado@<ms>" = arrivata al modulo
// (aspetta il Mac); "copiado" = messaggio copiato per il gruppo; "error" = invio fallito (senza rete). Sparisce quando i dati la danno per fatta.
function stSp(id){var v=store[id];if(v===true)return "pend";if(v==="copiado")return "copiado";if(v==="error")return "error";if(v==="enviando")return "enviando";if(typeof v==="string"&&v.indexOf("enviado@")===0)return "enviado";return ""}
function enCamino(t){var e=stSp(t.id);return !hecha(t)&&(e==="enviado"||e==="enviando"||e==="copiado")}
function vecchiaEnviada(t){var v=store[t.id];if(typeof v!=="string"||v.indexOf("enviado@")!==0)return false;return Date.now()-Number(v.slice(8))>30*60e3}
function inSospeso(){return DATA.tareas.filter(function(t){var e=stSp(t.id);return !hecha(t)&&(e==="pend"||e==="error"||vecchiaEnviada(t))})}
function enviar(t,accion){
  // copia di prova: la spunta mostra lo stato "inviata" ma non parte verso nessuno
  if(COPIA_PROVA){if(accion==="hecho"){store[t.id]="enviado@"+Date.now()}else{delete store[t.id]}salva();return Promise.resolve(true)}
  if(!SPUNTE||!SPUNTE.url||!window.fetch||!window.FormData){if(accion==="hecho"){store[t.id]=true}else{delete store[t.id]}salva();return Promise.resolve(false)}
  var fd=new FormData(),E=SPUNTE.entradas;
  fd.append(E.id,t.id);fd.append(E.persona,persona==="todos"?(t.quien[0]||""):persona);fd.append(E.accion,accion);
  fd.append(E.titulo,L(t.titulo));fd.append(E.firma,fmt(T("firma"),{g:actTxt(),h:hhmm(Date.now())}));
  if(accion==="hecho"){store[t.id]="enviando";salva()}
  return fetch(SPUNTE.url,{method:"POST",mode:"no-cors",body:fd,keepalive:true}).then(function(){
    if(accion==="hecho"){store[t.id]="enviado@"+Date.now()}else{delete store[t.id]}salva();return true
  }).catch(function(){if(accion==="hecho"){store[t.id]="error"}salva();return false})
}

  var txt=(lang==="es"?"Plan de Equipo, mi semana al ":"Piano di Squadra, la mia settimana al ")+ddmm(HOY)+(persona!=="todos"?" · "+UI.chi_nome[persona]:"")+"\n"+(righe.join("\n")||T("lista_vacia"));
  function ok(){$("copiado").textContent=T("copiado");setTimeout(function(){$("copiado").textContent=""},2500)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,function(){window.prompt("",txt)})}else{window.prompt("",txt)}
});
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function apriCifrato(parola){
  var raw=b64(CIFRATO),salt=raw.slice(0,16),ct=raw.slice(16),enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(parola),"PBKDF2",false,["deriveBits"]).then(function(km){
    return crypto.subtle.deriveBits({name:"PBKDF2",salt:salt,iterations:100000,hash:"SHA-256"},km,384)}).then(function(bits){
    var b=new Uint8Array(bits);return crypto.subtle.importKey("raw",b.slice(0,32),{name:"AES-CBC"},false,["decrypt"]).then(function(key){
      return crypto.subtle.decrypt({name:"AES-CBC",iv:b.slice(32,48)},key,ct)})}).then(function(pt){
    return JSON.parse(new TextDecoder().decode(pt))});
}
var CT={tit:{it:"Parola d'accesso",es:"Palabra de acceso"},sotto:{it:"La pagina è riservata al team Re·Vive. Scrivi la parola che ti ha dato Giuseppe: resta salvata su questo dispositivo.",es:"La página es reservada al equipo Re·Vive. Escribe la palabra que te dio Giuseppe: queda guardada en este dispositivo."},entra:{it:"Entra",es:"Entrar"},no:{it:"Parola non giusta, riprova.",es:"Palabra incorrecta, inténtalo otra vez."},nocrypto:{it:"Questo browser non può aprire la pagina protetta: usa Safari o Chrome aggiornati.",es:"Este navegador no puede abrir la página protegida: usa Safari o Chrome actualizados."}};
function avvia(){
  if(DATA){pulisci();render();reinvia();return}
  var c=$("cancello");document.querySelectorAll("#cancello [data-c]").forEach(function(el){el.textContent=CT[el.getAttribute("data-c")][lang]||""});c.hidden=false;
  if(!(window.crypto&&crypto.subtle)){$("cancello-msg").textContent=CT.nocrypto[lang];return}
  // la stessa parola del Panel e la stessa chiave del browser: chi e' gia' entrato nel Panel da questo telefono entra senza riscriverla
  function prova(parola,salvala){apriCifrato(parola).then(function(d){DATA=d;if(salvala){try{localStorage.setItem("cruscotto-revive-parola",parola)}catch(e){}}c.hidden=true;pulisci();render();reinvia()}).catch(function(){if(salvala)$("cancello-msg").textContent=CT.no[lang]})}
  var ricordata="";try{ricordata=localStorage.getItem("cruscotto-revive-parola")||""}catch(e){}
  if(ricordata)prova(ricordata,false);
  $("cancello-form").addEventListener("submit",function(e){e.preventDefault();$("cancello-msg").textContent="";prova($("cancello-parola").value.trim(),true)});
  $("cancello-parola").focus();
}
avvia();
